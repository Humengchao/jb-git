name: Release

# Every push to main publishes a new patch release. Add [skip release] to a commit subject to
# land a change without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Version part to raise
        type: choice
        default: patch
        options: [patch, minor, major]

# One release at a time: concurrent runs would race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  extension-host:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    strategy:
      fail-fast: true
      matrix:
        vscode: ["1.95.0", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:extension -- ${{ matrix.vscode }}

  publish:
    needs: [verify, extension-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changelog entry can list the commits since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Without a token the release is still built, versioned, tagged and attached to a
      # GitHub release; only the Marketplace upload is left for a human.
      - name: Check for a marketplace token
        id: token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VSCE_PAT is not set, so this release will NOT be published to the Marketplace. Upload the VSIX from the GitHub release, or add the secret to publish automatically."
          fi

      # Cursor, Windsurf and VSCodium install from Open VSX rather than the
      # Marketplace, so a release that skips it is invisible to those editors.
      - name: Check for an Open VSX token
        id: ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OVSX_PAT is not set, so this release will NOT reach Open VSX (Cursor, Windsurf, VSCodium). Create the namespace once with 'npx ovsx create-namespace hmc -p <token>', then add the secret."
          fi

      - name: Raise the version
        id: bump
        run: node scripts/bump-version.mjs "${{ inputs.release || 'patch' }}"

      - name: Package the extension
        run: npm run package

      # Record the release before publishing: if the push failed afterwards, the next run
      # would try to publish a version the Marketplace already holds and stay stuck there.
      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md README.md README.zh-CN.md
          git commit -m "chore: release $VERSION [skip release]"
          git tag -a "v$VERSION" -m "JB Git $VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Publish to the Visual Studio Marketplace
        if: steps.token.outputs.present == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath jb-git-*.vsix

      - name: Publish to Open VSX
        id: publish-ovsx
        if: steps.ovsx.outputs.present == 'true'
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # Keep the GitHub release usable if Open VSX rejects a duplicate or is
        # unavailable, but preserve the actual outcome for the summary below.
        run: npx ovsx publish jb-git-*.vsix -p "$OVSX_PAT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" jb-git-*.vsix --title "JB Git $VERSION" --generate-notes

      - name: Summarise the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PUBLISHED: ${{ steps.token.outputs.present }}
          OPEN_VSX: ${{ steps.ovsx.outputs.present }}
          OPEN_VSX_OUTCOME: ${{ steps.publish-ovsx.outcome }}
        run: |
          {
            echo "## JB Git $VERSION"
            if [ "$OPEN_VSX_OUTCOME" = "success" ]; then
              echo "Published to Open VSX (Cursor, Windsurf, VSCodium)."
            elif [ "$OPEN_VSX" = "true" ]; then
              echo "**Open VSX publish failed**: upload the VSIX manually at https://open-vsx.org."
            else
              echo "**Not on Open VSX**: \`OVSX_PAT\` is not configured."
            fi
            if [ "$PUBLISHED" = "true" ]; then
              echo "Published to the Visual Studio Marketplace."
            else
              echo "**Not published**: \`VSCE_PAT\` is not configured."
              echo "Download \`jb-git-$VERSION.vsix\` from the [release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v$VERSION) and upload it at <https://marketplace.visualstudio.com/manage/publishers/hmc>."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
