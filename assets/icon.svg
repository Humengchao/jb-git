<!-- Source for assets/icon.png. Regenerate with:
       chrome --headless --screenshot=logo.png --window-size=512,512 \
              --default-background-color=00000000 assets/icon.svg
       then: sips -Z 256 logo.png --out assets/icon.png
     The manifest cannot reference an SVG icon, so the PNG is the shipped asset. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#31415f"/>
      <stop offset="1" stop-color="#141a27"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="7" y="7" width="498" height="498" rx="105" fill="none" stroke="#47597c" stroke-width="8"/>

  <!-- The commit graph is the extension's centrepiece, so the mark is one branch leaving the
       trunk and merging back. Kept to two lanes and heavy strokes so it survives at 42px. -->
  <g fill="none" stroke-width="27" stroke-linecap="round">
    <path d="M182 118 V394" stroke="#4daafc"/>
    <path d="M182 166 C182 236 330 214 330 256 C330 298 182 276 182 346" stroke="#c9a9ff"/>
  </g>

  <g stroke="#141a27" stroke-width="18">
    <circle cx="182" cy="118" r="42" fill="#4daafc"/>
    <circle cx="182" cy="256" r="42" fill="#4daafc"/>
    <circle cx="182" cy="394" r="42" fill="#4daafc"/>
    <circle cx="330" cy="256" r="38" fill="#c9a9ff"/>
  </g>
</svg>
